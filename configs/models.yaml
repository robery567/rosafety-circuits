# Paper 4 model registry
#
# All three anchors are the exact Paper 3 anchors (shared selected_blocks +
# RD-DPO adapters), so probes (H1a/b), patching (H1c) and the Paper-3 cross-
# reference (H1d) run apples-to-apples on every model. gemma-3-4b-it doubles
# as the SAE anchor (H1e) via Gemma Scope 2 — the Gemma 3 family SAE suite.
#
#   - anchor: full method sweep (probes + patching + H1d).
#   - judge:  behavioral refusal labeling (reused from Paper 2).

anchors:
  - id: Qwen/Qwen2.5-3B-Instruct
    short: qwen2.5-3b
    family: qwen2.5
    params: 3B
    n_blocks: 36
    paper2_baseline: {tox: 0.333, jb: 0.330, xl: 0.222}
    paper3_probe: ../paper3-alignment/data/probes/qwen2.5-3b/selected_blocks.json

  - id: meta-llama/Llama-3.2-3B-Instruct
    short: llama-3.2-3b
    family: llama
    params: 3B
    n_blocks: 28
    paper2_baseline: {tox: 0.161, jb: 0.237, xl: 0.160}
    paper3_probe: ../paper3-alignment/data/probes/llama-3.2-3b/selected_blocks.json

  - id: google/gemma-3-4b-it
    short: gemma-3-4b
    family: gemma3
    params: 4B
    n_blocks: 34            # verify on load (config.num_hidden_layers)
    paper2_baseline: {tox: 0.349, jb: 0.505, xl: 0.210}
    paper3_probe: ../paper3-alignment/data/probes/gemma-3-4b/selected_blocks.json
    # SAE anchor (H1e): Gemma Scope 2 (Lieberum et al.; Gemma 3 family).
    # `_all` folders carry SAEs for EVERY layer (reduced width/L0 set); the
    # plain `resid_post` folder has 4 layers (25/50/65/85% depth) with the full
    # width range. We iterate band layers, so we use the `_all` release.
    sae:
      release: gemma-scope-2-4b-pt-res-all   # Gemma Scope 2, every-layer resid_post SAEs
      site: resid_post
      width: "16k"          # -res-all carries widths {16k, 262k}
      l0: big               # -res-all carries L0 {small, big} only (no 'medium')
      sae_id_format: "layer_{layer}_width_{width}_l0_{l0}"
      # No -it SAEs exist for Gemma-3: these base(-pt)-trained SAEs are applied to
      # the -it model's residual stream — a documented approximation for H1e.

# Behavioral refusal judge — match Paper 2/3 exactly for cross-paper consistency.
judge:
  primary: openai/gpt-5-mini
  second_rater: anthropic/claude-opus-4.5
  second_rater_subset_size: 200
  via: openrouter

# Activation capture + generation params — match Paper 2/3 exactly.
capture:
  position: last_assistant_prefix     # see EXPERIMENT_DESIGN §1, matches Paper 3
  dtype: bfloat16
  blocks: all
  ablation_positions: [mean_prompt, last_prompt_token]   # off by default
  ablation_sublayers: [attn_out, mlp_out]                # off by default

generation:
  max_new_tokens: 256
  temperature: 0.0      # greedy / deterministic for capture + behavioral labels
  top_p: 1.0
